schema_version: 1
scene_name: fruit1_full
photos:
  max_frames: 120
  max_long_edge: 960
  min_sharpness: 12.0
  min_difference: 0.0
  jpeg_quality: 95
colmap:
  backend: pycolmap
  camera_model: PINHOLE
  single_camera: true
  use_gpu: false
  matcher: exhaustive
  guided_matching: true
  reuse_database: data/scenes/fruit1/colmap/database.db
  minimum_registered_frames: 8
  num_threads: 8
  max_runtime_seconds: 900
reconstruction:
  max_iterations: 7000
recognition:
  candidates: [apple, banana, durian, bread, orange, pear, table, plate, unknown]
