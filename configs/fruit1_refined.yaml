schema_version: 1
photos:
  max_frames: 120
  max_long_edge: 960
  min_sharpness: 12.0
  min_difference: 0.0
  jpeg_quality: 95
colmap:
  backend: pycolmap
  camera_model: SIMPLE_PINHOLE
  single_camera: true
  use_gpu: false
  reuse_database: data/outputs/fruit1_filtered.db
  reuse_verified_matches: true
  refine_focal_length: false
  structure_less_registration_fallback: false
  init_min_tri_angle: 8
  minimum_registered_frames: 30
  num_threads: 8
  max_runtime_seconds: 600
