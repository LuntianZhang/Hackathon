schema_version: 1
frames:
  max_frames: 120
  max_long_edge: 960
  min_sharpness: 0
  min_difference: 0
colmap:
  backend: pycolmap
  camera_model: SIMPLE_RADIAL
  single_camera: true
  use_gpu: false
  matcher: exhaustive
  guided_matching: true
  minimum_registered_frames: 2
  num_threads: 8
  max_runtime_seconds: 300
reconstruction:
  cull_alpha_thresh: 0.01
  densify_grad_thresh: 0.0004
  stop_split_at: 6000
  use_absgrad: false
