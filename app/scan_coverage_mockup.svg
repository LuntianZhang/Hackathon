<text x="336" y="409" text-anchor="middle" font-size="13" fill="#586c4d">食物图形仅为示意，实际显示实时画面</text>
<rect x="52" y="451" width="568" height="35" rx="10" fill="#edf3e5"/>
<text x="68" y="474" font-size="14">→ 继续向右绕行，补拍灰色区域；保持整个餐盘入镜</text>
<text x="54" y="514" font-size="13" fill="#6e7f64">示例：合格照片 34 张 · 待定位 2 张</text>
