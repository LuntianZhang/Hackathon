<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
<title id="title">食物环绕扫描与拍摄方向覆盖图，规划示意</title>
<desc id="desc">左侧摄像头预览，右侧两层分段圆环表示低视角与高视角。绿格代表有合格照片，灰格未拍，黄色待确认，红色需补拍。仅设计，尚未实现。</desc>
<rect width="1120" height="720" fill="#f4f6ef"/>
<g font-family="Microsoft YaHei,Arial,sans-serif" fill="#263b2c">
<text x="32" y="51" font-size="26" font-weight="bold">环绕扫描 · 拍摄方向覆盖</text>
<text x="32" y="81" font-size="14" fill="#70806b">先绕一圈，再抬高补拍；照片合格且位置可信，才计入覆盖。</text>
<rect x="876" y="29" width="212" height="33" rx="16" fill="#e7eadf"/>
<text x="982" y="51" text-anchor="middle" font-size="13">规划示意 · 尚未实现</text>
