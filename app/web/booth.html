<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>盘感 PanSense · 展台</title>
<style>
  /* ─────────────────────────────────────────────
     展台三栏
       左 = 一句大问题 + 三维转盘（不放数字）
       中 = 127.0.0.1:8000 的 App 本体（同源 iframe）
       右 = 解释器：四颗水果轮流播放，各配一张三维坐标体积图
     尺寸全部按视口高度缩放，换屏幕不会被切掉。
     快捷键见同目录 使用说明.md
     ───────────────────────────────────────────── */

  :root{
    --k: 1.15;
    --ink: #e8eef6;
    --dim: #93a2b5;
    --mute: #5d6b7d;
    --live: #4ade80;
    --warm: #f6c665;
    --ref: #9fb0c4;
    --bg0: #0b0e13;
    --card: rgba(255,255,255,.035);
    --line: rgba(255,255,255,.08);
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }

  body{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    background:
      radial-gradient(1100px 640px at 50% 20%, #1a2330 0%, transparent 62%),
      var(--bg0);
    color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow:hidden;
    -webkit-font-smoothing: antialiased;
  }

  .col{ position:relative; height:100vh; }

  /* ───────── 左：大问题 + 转盘 ───────── */
  .col-left{
    display:flex; flex-direction:column; justify-content:center;
    padding: 4vh 3.4vh 4vh 4.2vh;
    border-right:1px solid var(--line);
    gap: 3.4vh;
  }

  .kicker{
    font-size: clamp(10px, 1.15vh, 14px);
    letter-spacing:.22em; color:var(--mute); text-transform:uppercase;
  }

  .question{
    margin: 0; display:flex; flex-direction:column; align-items:flex-start;
    gap: clamp(2px, .5vh, 8px);
    letter-spacing:-.02em; font-weight:750;
  }
  .question span{ display:block; line-height:1.16; }
  .q1{ font-size: clamp(20px, 3.9vh, 48px); color:#b9c7d8; }
  .q2{ font-size: clamp(26px, 5vh, 62px); color:#f6c665; }
  .q3{
    font-size: clamp(30px, 6.1vh, 78px); color:#f4544a; font-weight:800;
    text-shadow: 0 0 46px rgba(244,84,74,.28);
  }

  .turntable{
    position:relative;
    width:100%; aspect-ratio:1/1;
    border-radius: clamp(14px, 2vh, 24px);
    background: radial-gradient(circle at 50% 42%, #f7f7f4 0%, #ecebe6 60%, #e2e1da 100%);
    overflow:hidden;
    cursor:grab;
    touch-action:none;
    box-shadow: 0 18px 40px -22px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.06) inset;
  }
  .turntable.dragging{ cursor:grabbing; }
  .turntable img{
    width:100%; height:100%; object-fit:contain; display:block;
    user-select:none; -webkit-user-drag:none; pointer-events:none;
  }
  .tt-hint{
    position:absolute; left:50%; bottom:1.4vh; transform:translateX(-50%);
    font-size: clamp(10px, 1.15vh, 13px); letter-spacing:.16em; color:#8a8a80;
    transition:opacity .6s ease; pointer-events:none; white-space:nowrap;
  }
  .tt-hint.gone{ opacity:0; }

  /* ───────── 中：App ───────── */
  .col-mid{
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  .device{
    position:relative;
    padding: 18px 10px 10px;
    border-radius: 56px;
    background: linear-gradient(160deg, #2b333e 0%, #171c24 42%, #0d1117 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.07) inset,
      0 0 0 2px rgba(0,0,0,.55),
      0 26px 52px -26px rgba(0,0,0,.9);
    zoom: var(--k);
  }
  .device::before{
    content:""; position:absolute; top:7px; left:50%; transform:translateX(-50%);
    width:62px; height:6px; border-radius:3px; background:#05070a;
  }
  .device::after{
    content:""; position:absolute; top:6px; left:calc(50% + 44px);
    width:8px; height:8px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #2a3550 0%, #0a0d13 70%);
  }
  .screen{
    position:relative;
    width: 440px; height: 860px;
    border-radius: 46px;
    overflow:hidden;
    background:#f7f8f3;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6) inset;
  }
  iframe{ display:block; width:100%; height:100%; border:0; background:#f7f8f3; color-scheme:light; }

  .veil{
    position:absolute; inset:0; z-index:3;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:#f2f4ee; color:#5a6a5f;
    font-size: clamp(12px, 1.5vh, 16px);
    transition: opacity .45s ease;
  }
  .veil.hide{ opacity:0; pointer-events:none; }
  .veil-dot{ width:9px; height:9px; border-radius:50%; background:#7fbf7f; }

  /* ───────── 右：四颗水果轮流 + 三维体积图 ───────── */
  .col-right{
    display:flex; flex-direction:column;
    justify-content:space-between;          /* 三组内容上中下撑开，不挤成一小团 */
    padding: 4vh 4.4vh 3.4vh 4vh;
    border-left:1px solid var(--line);
    min-width:0;
  }

  .r-kicker{
    font-size: clamp(12px, 1.45vh, 17px);
    letter-spacing:.22em; color:var(--mute); text-transform:uppercase;
  }

  .r-mid{ min-height:0; }
  .r-bot{ display:flex; flex-direction:column; }

  .card{
    display:flex; flex-direction:column;

    transition: opacity .32s ease, transform .32s ease;
  }
  .card.out{ opacity:0; transform: translateY(8px); }

  .fruit-head{ display:flex; align-items:baseline; gap:1.4vh; }
  .fruit-name{
    font-size: clamp(22px, 3.4vh, 40px); font-weight:650; color:#dfe8f3;
  }
  .fruit-id{
    font-size: clamp(12px, 1.45vh, 17px); color:var(--mute);
    letter-spacing:.1em; border:1px solid var(--line); border-radius:6px;
    padding:.3vh .8vh;
  }

  .hero{ display:flex; align-items:baseline; gap:1.2vh; margin-top:1vh; }
  .hero-num{
    font-size: clamp(60px, 14.5vh, 160px); line-height:.88; font-weight:760;
    letter-spacing:-.045em; font-variant-numeric: tabular-nums; color:#f2f6fb;
    text-shadow: 0 0 60px rgba(120,170,255,.16);
  }
  .hero-unit{ font-size: clamp(17px, 3.5vh, 39px); font-weight:600; color:var(--dim); }

  .sub{
    margin-top:1.2vh; font-size: clamp(16px, 2.55vh, 29px); color:#b7c5d6;
    font-variant-numeric: tabular-nums;
  }
  .sub small{ font-size:.72em; color:var(--mute); margin-left:.6vh; }
  .sub .kcal{
    font-size:1.6em; font-weight:780; color:#f4544a;
    letter-spacing:-.01em; margin-left:.2vh;
    font-variant-numeric: tabular-nums;
  }

  .chart{
    margin-top:2vh;
    display:flex; flex-direction:column; align-items:flex-start; gap: clamp(10px, 1.7vh, 22px);
  }
  .chart img{
    width: clamp(160px, 30vh, 330px); height: clamp(160px, 30vh, 330px);
    flex:none; object-fit: contain;
    border-radius: clamp(10px, 1.4vh, 16px);
    background:#fff;
    box-shadow: 0 14px 30px -20px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.07) inset;
  }
  .chart-side{ min-width:0; max-width:100%; }
  .chart-dims{
    font-size: clamp(16px, 2.3vh, 26px); color:#cfdae7;
    font-variant-numeric: tabular-nums; letter-spacing:.01em;
  }
  .chart-note{
    margin-top:1vh; font-size: clamp(12px, 1.8vh, 20px); color:var(--mute);
    line-height:1.55;
  }

  .meta{
    margin-top:2vh; display:flex; flex-wrap:wrap; gap: clamp(8px, 1.6vh, 20px);
    font-size: clamp(12px, 1.8vh, 19px); color:var(--mute);
  }
  .meta b{ color:#a8b7c8; font-weight:600; font-variant-numeric:tabular-nums; }

  .dots{
    display:flex; gap:.9vh; margin-top:2.4vh;
  }
  .dots i{
    width: clamp(16px, 2.6vh, 30px); height:3px; border-radius:2px;
    background:rgba(255,255,255,.12); transition:background .4s ease;
  }
  .dots i.on{ background:#f6c665; }

  .legend{
    display:flex; flex-wrap:wrap; gap: clamp(8px, 1.6vh, 20px);
    margin-top:1.6vh;
    font-size: clamp(10px, 1.4vh, 15px); color:var(--mute); letter-spacing:.04em;
  }
  .legend i{ display:inline-flex; align-items:center; gap:6px; font-style:normal; }
  .pip{ width:7px; height:7px; border-radius:50%; flex:none; }
  .pip.g{ background:var(--live); }
  .pip.y{ background:var(--warm); }
  .pip.w{ background:var(--ref); }

  .foot{
    margin: 2.6vh 0 0; padding-left: clamp(9px, 1.4vh, 18px);
    border-left:2px solid rgba(246,198,101,.32);
    font-size: clamp(14px, 2.2vh, 24px); line-height:1.62; color:#8c9bad;
    max-width: 44ch;
    transition: opacity .5s ease;
  }
  .foot.fade{ opacity:0; }

  /* 矮屏（约 1280×720 这类）再收一档，保证不溢出 */
  @media (max-height: 820px){
    .hero-num{ font-size: clamp(52px, 12.4vh, 130px); }
    .chart img{ width: clamp(140px, 24vh, 250px); height: clamp(140px, 24vh, 250px); }
    .foot{ font-size: clamp(12px, 1.8vh, 20px); }
    .r-kicker,.fruit-id{ font-size: clamp(11px, 1.25vh, 15px); }
  }

  /* ───────── 状态 ───────── */
  .hud{
    position:fixed; z-index:10; pointer-events:none;
    font-size: clamp(10px, 1.15vh, 13px); letter-spacing:.06em; color:#5d6b7d;
  }
  .hud.tl{ top:2vh; left:2.2vh; display:flex; align-items:center; gap:9px; }
  .hud.tl b{ color:#9fb0c4; font-weight:600; font-size: clamp(11px, 1.25vh, 14px); }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--live);
        box-shadow:0 0 0 4px rgba(74,222,128,.12), 0 0 12px rgba(74,222,128,.6); }
  .hidden{ opacity:0 !important; }

  .alert{
    position:fixed; left:50%; bottom:3vh; transform:translate(-50%, 12px);
    z-index:20; display:flex; align-items:center; gap:12px;
    padding:1.4vh 2.2vh; border-radius:13px;
    background:#2a1416; border:1px solid #7f2d33; color:#ffb4b8;
    font-size: clamp(11px, 1.5vh, 15px);
    opacity:0; pointer-events:none; transition: opacity .3s ease, transform .3s ease;
  }
  .alert.on{ opacity:1; transform:translate(-50%, 0); }
  .alert b{ color:#ff8b92; font-weight:700; }
</style>
</head>
<body>

<!-- 左：一句大问题 + 转盘 -->
<aside class="col col-left">
  <div class="kicker">3D PLATE</div>
  <h1 class="question"><span class="q1">这些水果</span><span class="q2">有多大？</span><span class="q3">有多少热量？！</span></h1>
  <div class="turntable" id="turntable">
    <img id="turnImg" src="turntable/12.jpg" alt="三维餐盘">
    <div class="tt-hint" id="ttHint">← 按住拖动 →</div>
  </div>
</aside>

<!-- 中：App 本体 -->
<main class="col col-mid" id="midCol">
  <div class="device">
    <div class="screen">
      <iframe id="app" src="/" title="盘感 PanSense 应用"
              allow="camera; microphone; clipboard-write; fullscreen; autoplay"></iframe>
      <div class="veil" id="veil"><span class="veil-dot"></span>正在打开 127.0.0.1:8000…</div>
    </div>
  </div>
</main>

<!-- 右：四颗水果轮流播放 -->
<aside class="col col-right">
  <div class="r-kicker">WHAT THIS MEANS</div>

  <div class="r-mid">
  <div class="card" id="card">
    <div class="fruit-head">
      <span class="fruit-name" id="fruitName">—</span>
      <span class="fruit-id" id="fruitId">—</span>
    </div>

    <div class="hero">
      <div class="hero-num" id="heroNum">—</div>
      <div class="hero-unit">mL</div>
    </div>

    <div class="sub" id="sub">—</div>

    <div class="chart">
      <img id="plotImg" src="plots/orange.png" alt="三维坐标体积图">
      <div class="chart-side">
        <div class="chart-dims" id="chartDims">—</div>
        <div class="chart-note" id="chartNote">—</div>
      </div>
    </div>

    <div class="meta" id="meta"></div>
  </div>

    <div class="dots" id="dots"></div>
  </div>

  <div class="r-bot">
    <div class="legend">
      <i><span class="pip g"></span>实时交互</i>
      <i><span class="pip y"></span>预渲染模型</i>
      <i><span class="pip w"></span>目录参考</i>
    </div>

    <p class="foot" id="foot">体积是凸包包围体积，凹陷和遮挡会带来误差；我们叫它粗估，不是称重。</p>
  </div>
</aside>

<div class="hud tl" id="hud"><span class="dot" id="liveDot"></span><b>127.0.0.1:8000</b><span id="liveText">实时</span></div>
<div class="alert" id="alert"><b>连不上 App</b><span>请先运行 tools/start_app.ps1，再按 R</span></div>

<script>
const APP_PORT = '8000';
const SAME_ORIGIN = location.port === APP_PORT;
const APP = SAME_ORIGIN ? '/' : 'http://127.0.0.1:' + APP_PORT + '/';
const ROUTES = { '1':'#home', '2':'#diary', '3':'#scan', '4':'#profile' };
const FRAMES = 25;

const frame = document.getElementById('app');
const veil  = document.getElementById('veil');
const hud   = document.getElementById('hud');
const alertEl = document.getElementById('alert');
const midCol = document.getElementById('midCol');

const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k, String(v)) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};

/* ── 手机缩放 ── */
let curK = 1;
const DEVICE_H = 888, DEVICE_W = 460;
function applyScale(k){
  curK = Math.min(2, Math.max(0.42, +k.toFixed(3)));
  document.documentElement.style.setProperty('--k', curK.toFixed(3));
}
function fitScale(){
  const byHeight = (window.innerHeight - 18) / DEVICE_H;
  const byWidth  = (midCol.clientWidth - 24) / DEVICE_W;
  const auto = Math.min(byHeight, byWidth, 2);
  const saved = parseFloat(store.get('booth.k') || '');
  applyScale(Number.isFinite(saved) && saved > 0 ? saved : auto);
}
window.addEventListener('resize', () => { if(!store.get('booth.lock')) fitScale(); });

/* ── 转盘 ── */
const turnEl  = document.getElementById('turntable');
const turnImg = document.getElementById('turnImg');
const ttHint  = document.getElementById('ttHint');

let idx = 12, dragging = false, lastX = 0, swayDir = 1, lastSway = 0, idleAt = 0;
const frames = [];
for(let i = 0; i < FRAMES; i++){
  const img = new Image();
  img.src = 'turntable/' + String(i).padStart(2, '0') + '.jpg';
  frames.push(img);
}
function show(i){
  idx = Math.max(4, Math.min(20, i));      // 两端会露出板子断面，夹一下
  const src = frames[idx].src;
  if(turnImg.src !== src) turnImg.src = src;
}
turnEl.addEventListener('pointerdown', event => {
  dragging = true; lastX = event.clientX;
  turnEl.classList.add('dragging');
  try{ turnEl.setPointerCapture(event.pointerId); }catch(error){}
  ttHint.classList.add('gone');
  event.preventDefault();
});
window.addEventListener('pointermove', event => {
  if(!dragging) return;
  const dx = event.clientX - lastX;
  if(Math.abs(dx) >= 6){ show(idx + Math.round(dx / 6)); lastX = event.clientX; }
});
function endDrag(){ dragging = false; idleAt = performance.now(); turnEl.classList.remove('dragging'); }
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

function sway(now){
  if(!dragging && now - idleAt > 2400 && now - lastSway > 85){
    lastSway = now;
    idx += swayDir;
    if(idx >= 19){ idx = 19; swayDir = -1; }
    if(idx <= 5){ idx = 5; swayDir = 1; }
    show(idx);
  }
  requestAnimationFrame(sway);
}
requestAnimationFrame(sway);
show(12);

/* ── 底部边界那句话，慢慢轮换 ── */
const NOTES = [
  '体积是凸包包围体积，凹陷和遮挡会带来误差；我们叫它粗估，不是称重。',
  '重量 = 体积 × 密度。这里的密度来自分类默认值，不是这一餐实测。',
  '还没有排水法真值 —— 所以这里只敢说“约”，不说“是”。',
  '手机里那个三维餐盘是真的在渲染；左边这一圈只是同一台机器提前算好的。'
];
const footEl = document.getElementById('foot');
let noteIndex = 0;
setInterval(() => {
  footEl.classList.add('fade');
  setTimeout(() => {
    noteIndex = (noteIndex + 1) % NOTES.length;
    footEl.textContent = NOTES[noteIndex];
    footEl.classList.remove('fade');
  }, 520);
}, 7000);

/* ── 三维坐标体积图：用 pj 实验里裁出来的真实分布图 ── */
const PLOT_BY_ID = { 1: 'plots/orange.png', 2: 'plots/grape.png', 3: 'plots/tomato.png', 4: 'plots/blueberry.png' };
const PLOT_BY_NAME = [
  ['橙', 'plots/orange.png'], ['橘', 'plots/orange.png'],
  ['葡', 'plots/grape.png'],
  ['番', 'plots/tomato.png'], ['草', 'plots/tomato.png'],
  ['蓝', 'plots/blueberry.png'], ['莓', 'plots/blueberry.png']
];
function plotFor(item){
  if(PLOT_BY_ID[item.instance_id]) return PLOT_BY_ID[item.instance_id];
  const hit = PLOT_BY_NAME.find(([word]) => (item.name || '').includes(word));
  return hit ? hit[1] : 'plots/orange.png';
}

/* ── 四颗水果轮流播放 ── */
const cardEl = document.getElementById('card');
const dotsEl = document.getElementById('dots');
let fruits = [], fruitIndex = 0, cycleTimer = null;

function renderFruit(i){
  const f = fruits[i];
  if(!f) return;
  document.getElementById('fruitName').textContent = f.name;
  document.getElementById('fruitId').textContent = f.instance_id ? 'ID ' + f.instance_id : '手工项';
  document.getElementById('heroNum').textContent = f.ml.toFixed(1);
  document.getElementById('sub').innerHTML = f.grams
    ? ('≈ ' + Math.round(f.grams) + ' g' + (f.kcal ? ' · <b class="kcal">' + Math.round(f.kcal) + ' kcal</b>' : '') +
       '<small>' + (f.kcal ? '体积 × 密度 → 热量' : '热量待补充') + '</small>')
    : '待估算';

  document.getElementById('plotImg').src = f.plot;
  document.getElementById('chartDims').textContent =
    f.ext.map(v => v.toFixed(1)).join(' × ') + ' cm';
  document.getElementById('chartNote').textContent =
    '凸包 ' + f.ml.toFixed(0) + ' mL ／ 外接盒 ' + Math.round(f.boxMl) + ' cm³';

  const metaEl = document.getElementById('meta');
  metaEl.innerHTML =
    '<span>视角 <b>' + (f.views || '—') + '</b></span>' +
    '<span>高斯中心 <b>' + Number(f.gauss).toLocaleString() + '</b></span>' +
    '<span>密度 <b>' + (f.density ? f.density.toFixed(2) + ' g/mL' : '—') + '</b></span>' +
    '<span>' + f.densityLabel + '</span>';

  [...dotsEl.children].forEach((dot, k) => dot.classList.toggle('on', k === i));
}

function cycle(){
  if(fruits.length < 2) return;
  cardEl.classList.add('out');
  setTimeout(() => {
    fruitIndex = (fruitIndex + 1) % fruits.length;
    renderFruit(fruitIndex);
    cardEl.classList.remove('out');
  }, 330);
}

/* ── 读真实数据 ── */
const fmt = (value, digits = 1) => (value === null || value === undefined || Number.isNaN(value))
  ? '—' : Number(value).toFixed(digits);

function densityStatusLabel(density){
  if(!density) return '未知来源';
  if(density.status === 'food_reference') return '食品专属参考';
  if(density.status === 'user_reference') return '用户填写';
  if(density.status === 'category_default') return '水果分类默认值';
  return density.status || '未知来源';
}

async function loadMeal(){
  try{
    let id = new URLSearchParams(location.search).get('meal');
    if(!id){
      const list = await fetch('/api/meals', { cache:'no-store' }).then(r => r.json());
      const with3d = (list.meals || []).filter(meal => meal.three_d_available);
      if(!with3d.length) return;
      id = with3d[0].id;
    }
    const meal = await fetch('/api/meals/' + id, { cache:'no-store' }).then(r => r.json());
    fill(meal);
  }catch(error){
    console.warn('数据没读到：', error);
  }
}

function fill(meal){
  const summary = meal.volume_summary || {};
  fruits = (meal.items || []).filter(item => item.volume && item.volume.volume_ml).map(item => {
    const volume = item.volume;
    const ratio = (volume.max_span_cm && volume.max_span_model_units)
      ? volume.max_span_cm / volume.max_span_model_units : 0;
    const ext = (volume.axis_extents_model_units || []).map(v => v * ratio);
    const density = (item.density && item.density.value_g_ml) || (item.nutrition && item.nutrition.density_g_ml);
    const ml = volume.volume_ml;
    return {
      name: item.name || '食物',
      instance_id: item.instance_id,
      plot: plotFor(item),
      ml,
      grams: density ? ml * density : null,
      kcal: item.nutrition && item.nutrition.kcal,
      ext: ext.length === 3 ? ext : [ml ** (1/3), ml ** (1/3), ml ** (1/3)],
      boxMl: ext.length === 3 ? ext[0] * ext[1] * ext[2] : ml,
      gauss: volume.eligible_gaussians || 0,
      density,
      densityLabel: densityStatusLabel(item.density),
      views: summary.reference_views
    };
  }).sort((a, b) => b.ml - a.ml);

  if(!fruits.length) return;

  dotsEl.innerHTML = fruits.map((_, i) => '<i' + (i === 0 ? ' class="on"' : '') + '></i>').join('');
  renderFruit(0);
  clearInterval(cycleTimer);
  if(fruits.length > 1) cycleTimer = setInterval(cycle, 6500);
}

/* ── App 联动 ── */
frame.addEventListener('load', () => { veil.classList.add('hide'); bindInnerKeys(); });

function bindInnerKeys(){
  try{
    const doc = frame.contentDocument;
    if(doc && !doc.__boothBound){
      doc.__boothBound = true;
      doc.addEventListener('keydown', onKey);
    }
  }catch(e){}
}

function navTo(hash){
  const name = hash.slice(1);
  if(!SAME_ORIGIN){ frame.src = APP + hash; return; }
  try{
    const w = frame.contentWindow;
    const btn = w.document.querySelector('.tab[data-page="' + name + '"]');
    if(btn){ btn.click(); return; }
    w.location.hash = hash;
    w.dispatchEvent(new w.PopStateEvent('popstate'));
  }catch(e){ frame.src = APP + hash; }
}

function onKey(e){
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = (e.key || '').toLowerCase();
  if(k === 'f'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
  else if(k === 'r'){ location.reload(); }
  else if(ROUTES[k]){ navTo(ROUTES[k]); }
  else if(k === '+' || k === '='){ store.set('booth.lock','1'); applyScale(curK + 0.05); store.set('booth.k', curK); }
  else if(k === '-' || k === '_'){ store.set('booth.lock','1'); applyScale(curK - 0.05); store.set('booth.k', curK); }
  else if(k === '0'){ store.del('booth.lock'); store.del('booth.k'); fitScale(); }
  else if(k === 'h'){ hud.classList.toggle('hidden'); }
}
document.addEventListener('keydown', onKey);

/* ── 上电 ── */
fitScale();
loadMeal();

/* ── 服务探活 ── */
const liveDot = document.getElementById('liveDot');
const liveText = document.getElementById('liveText');
let lastOk = null;
async function probe(){
  let ok = false;
  try{ ok = (await fetch(APP + 'api/health', { cache:'no-store' })).ok; }catch(e){ ok = false; }
  if(ok !== lastOk){
    lastOk = ok;
    liveDot.style.background = ok ? '' : '#ef4444';
    liveText.textContent = ok ? '实时' : '离线';
    liveText.style.color = ok ? '' : '#ef8a8a';
    alertEl.classList.toggle('on', !ok);
  }
}
probe();
setInterval(probe, 5000);
</script>
