<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="505" viewBox="0 0 1200 505" role="img" aria-labelledby="title desc">
  <title id="title">定位板和物体掩码怎样排除背景</title>
  <desc id="desc">原始照片先检测定位板，再跟踪板上的完整物体；二者并集产生前景掩码，分别用于限制相机特征和把训练图像的外部背景变白。</desc>
  <defs>
    <style>
      .h{font:700 25px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#193345}
      .t{font:700 17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#193345}
      .s{font:14px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#40596a}
      .line{stroke:#60849b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60849b"/></marker>
  </defs>
  <rect width="1200" height="505" fill="#f5f8fa"/>
  <text x="42" y="52" class="h">背景排除：保留定位板和完整物体，忽略板外环境</text>
  <text x="42" y="82" class="s">这一步发生在相机定位之前；检测使用原始照片像素，不预设相机位姿</text>

  <text x="50" y="130" class="t">1 原始照片</text>
  <rect x="45" y="148" width="242" height="218" rx="12" fill="#c8d9dc" stroke="#9bb5c3" stroke-width="2"/>
  <rect x="70" y="238" width="188" height="108" rx="4" fill="#f6f3e9" stroke="#859da4"/>
  <rect x="78" y="246" width="18" height="18" fill="#344d57"/><rect x="230" y="246" width="18" height="18" fill="#344d57"/>
  <rect x="78" y="319" width="18" height="18" fill="#344d57"/><rect x="230" y="319" width="18" height="18" fill="#344d57"/>
  <ellipse cx="163" cy="249" rx="47" ry="58" fill="#e6a568" stroke="#bd7649" stroke-width="2"/>
  <ellipse cx="237" cy="194" rx="26" ry="17" fill="#7c9ca3"/>
  <text x="65" y="394" class="s">桌面和板外物体都在画面里</text>

  <path d="M289 255H330" class="line"/>
  <text x="342" y="130" class="t">2 板与物体轮廓</text>
  <rect x="335" y="148" width="242" height="218" rx="12" fill="#e8eff1" stroke="#9bb5c3" stroke-width="2"/>
  <rect x="360" y="238" width="188" height="108" rx="4" fill="#b8d7e7" stroke="#5e98b6" stroke-width="2"/>
  <ellipse cx="453" cy="249" rx="47" ry="58" fill="#efb27c" stroke="#c4794b" stroke-width="3"/>
  <text x="354" y="394" class="s">蓝：定位板；橙：完整物体</text>

  <path d="M579 255H620" class="line"/>
  <text x="632" y="130" class="t">3 二者取并集</text>
  <rect x="625" y="148" width="242" height="218" rx="12" fill="#263e47" stroke="#9bb5c3" stroke-width="2"/>
  <rect x="649" y="237" width="194" height="111" rx="5" fill="#fff"/>
  <ellipse cx="745" cy="248" rx="49" ry="60" fill="#fff"/>
  <text x="633" y="394" class="s">白：可保留；黑：板外背景</text>

  <path d="M869 255H910" class="line"/>
  <text x="922" y="130" class="t">4 两种下游用途</text>
  <rect x="915" y="148" width="242" height="218" rx="12" fill="#fff" stroke="#9bb5c3" stroke-width="2"/>
  <text x="935" y="198" class="t">COLMAP</text>
  <text x="935" y="226" class="s">只在白区提取相机特征</text>
  <path d="M937 246H1135" stroke="#b5c8ce" stroke-width="2"/>
  <text x="935" y="280" class="t">三维外观训练</text>
  <text x="935" y="308" class="s">将黑区像素替换为白色</text>
  <text x="935" y="337" class="s">板和高出板面的物体保留</text>

  <text x="45" y="462" class="s">示意图不表示真实掩码形状；去畸变后会用实际相机模型把掩码映射到训练图像坐标。</text>
</svg>
